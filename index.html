<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000000;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.calculator {
    width: 100%;
    max-width: 420px;
    padding: 15px;
}

.display {
    width: 100%;
    height: 100px;
    background: #222222;
    color: white;
    font-size: 42px;
    text-align: right;
    padding: 25px 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    overflow: hidden;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 75px;
    border: none;
    border-radius: 50%;
    font-size: 26px;
    background: #333333;
    color: white;
}

button:active {
    opacity: 0.6;
}

.operator {
    background: #ff9500;
}

.equal {
    background: #2196f3;
}

.clear {
    background: #777777;
}

</style>

</head>

<body>

<div class="calculator">

    <div id="display" class="display">0</div>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>

        <button onclick="appendValue('(')">
            (
        </button>

        <button onclick="appendValue(')')">
            )
        </button>

        <button class="operator" onclick="appendValue('/')">
            ÷
        </button>


        <button onclick="appendValue('7')">
            7
        </button>

        <button onclick="appendValue('8')">
            8
        </button>

        <button onclick="appendValue('9')">
            9
        </button>

        <button class="operator" onclick="appendValue('*')">
            ×
        </button>


        <button onclick="appendValue('4')">
            4
        </button>

        <button onclick="appendValue('5')">
            5
        </button>

        <button onclick="appendValue('6')">
            6
        </button>

        <button class="operator" onclick="appendValue('-')">
            −
        </button>


        <button onclick="appendValue('1')">
            1
        </button>

        <button onclick="appendValue('2')">
            2
        </button>

        <button onclick="appendValue('3')">
            3
        </button>

        <button class="operator" onclick="appendValue('+')">
            +
        </button>


        <button onclick="appendValue('0')" style="grid-column: span 2;">
            0
        </button>

        <button onclick="appendValue('.')">
            .
        </button>

        <button class="equal" onclick="calculate()">
            =
        </button>

    </div>

</div>


<script>

let expression = "";

let secretCode = "";


// ==========================================
// SECRET CODE
// ==========================================

const SECRET = "008989";


// ==========================================
// WEBSITE TO OPEN AFTER SECRET CODE
// ==========================================
// This is Google for testing.
// Replace this with your actual private website URL.

const PRIVATE_URL =
"home.html";


// ==========================================
// NUMBER / OPERATOR BUTTONS
// ==========================================

function appendValue(value) {

    // Add value to calculator expression
    expression += value;

    // Add value to hidden secret-code tracker
    secretCode += value;


    // Display calculator expression
    document.getElementById("display").innerText =
        expression || "0";


    // Keep only the last characters needed
    // for checking the secret code

    if (secretCode.length > SECRET.length) {

        secretCode =
            secretCode.slice(-SECRET.length);

    }


    // Check secret code

    if (secretCode === SECRET) {

        window.location.href = PRIVATE_URL;

    }

}


// ==========================================
// CLEAR BUTTON
// ==========================================

function clearDisplay() {

    expression = "";

    secretCode = "";

    document.getElementById("display").innerText = "0";

}


// ==========================================
// EQUAL BUTTON
// ==========================================

function calculate() {

    try {

        expression =
            eval(expression).toString();

        document.getElementById("display").innerText =
            expression;

    }

    catch (error) {

        expression = "";

        document.getElementById("display").innerText =
            "Error";

    }

}

</script>

</body>
</html>
